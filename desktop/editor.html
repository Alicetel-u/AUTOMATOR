<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIZURA 配置</title>
<link rel="stylesheet" href="/desktop/editor.css">
</head>
<body>
<header>
  <h1>配置</h1>
  <p>タイムラインで選択し、プレビューでドラッグして移動・右下で拡大縮小。歌詞のタイミングはメイン画面で変更します。</p>
</header>
<div class="stage" id="stage"><canvas id="view" width="1280" height="720"></canvas></div>
<div class="outro-controls">
  <label>曲末の演出 <select class="outro-select" aria-label="曲末の演出"></select></label>
  <button class="outro-roll" type="button">別の終わり方</button>
  <label><input class="outro-title" type="checkbox">最後に曲名を表示</label>
  <span class="outro-note muted"></span>
</div>
<div class="transport">
  <button id="btnPlay" type="button">&#9654;</button>
  <span class="tc" id="time">00:00.00 / 00:00.00</span>
  <button id="btnDelete" type="button">削除</button>
  <span class="tc muted" id="clipInfo"></span>
  <select id="shotImage" title="自動配置画像を選択" hidden></select>
  <button id="btnResetPosition" type="button" hidden>位置を戻す</button>
  <button id="btnExport" class="primary" type="button">MP4を書き出す</button>
  <span id="msg"></span>
</div>
<div class="tl">
  <div class="tl-bar">
    <button type="button" id="zoomOut" title="縮小">−</button>
    <button type="button" id="zoomFit" title="全体を表示">全体</button>
    <button type="button" id="zoomIn" title="拡大">＋</button>
    <button type="button" id="btnFillGaps" title="手で調整した配置は残し、未使用の画像から隙間を埋めます">隙間を自動で埋める</button>
    <span class="muted">ホイールで左右、Ctrl+ホイールで拡大</span>
  </div>
  <div id="tracks"></div>
</div>
<input id="addFront" class="picker" type="file" accept="image/*,video/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.heic,.jfif,.mp4,.webm,.mov" multiple>
<input id="addBack" class="picker" type="file" accept="image/*,video/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.heic,.jfif,.mp4,.webm,.mov" multiple>
<script src="/vendor/mp4-muxer.min.js"></script>
<script src="/src/01_util.js"></script>
