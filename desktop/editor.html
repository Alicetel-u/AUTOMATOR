<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIZURA 配置</title>
<link rel="stylesheet" href="/desktop/editor.css?v=transition-1">
</head>
<body>
<header>
  <h1>配置</h1>
  <p>タイムラインで選択し、プレビューでドラッグして移動・右下で拡大縮小。歌詞のタイミングはメイン画面で変更します。</p>
</header>
<div class="stage" id="stage"><canvas id="view" width="1280" height="720"></canvas></div>
<div class="outro-controls">
  <label>曲末の演出 <select class="outro-select" aria-label="曲末の演出"></select></label>
  <button class="outro-roll" type="button">別の終わり方</button>
  <label><input class="outro-title" type="checkbox">最後に曲名を表示</label>
  <span class="outro-note muted"></span>
</div>
<div class="transport">
  <button id="btnPlay" type="button">&#9654;</button>
  <span class="tc" id="time">00:00.00 / 00:00.00</span>
  <button id="btnSplit" type="button" title="選択した動画を再生位置で前半と後半に分割します">再生位置で分割</button>
  <button id="btnDelete" type="button">削除</button>
  <button id="btnReplace" type="button" title="元動画は書き出し用に残し、軽い動画をプレビューだけに使います">軽量プレビューを選ぶ</button>
  <span class="tc muted" id="clipInfo"></span>
  <select id="shotImage" title="自動配置画像を選択" hidden></select>
  <button id="btnResetPosition" type="button" hidden>位置を戻す</button>
  <button id="btnExport" class="primary" type="button">MP4を書き出す</button>
  <span id="msg"></span>
</div>
<div class="clip-transition-controls" id="clipTransitionControls" hidden>
  <label>切替効果 <select id="clipTransition">
    <option value="none">なし（カット）</option>
    <option value="dissolve">クロスフェード</option>
    <option value="flash">フラッシュ</option>
    <option value="wipe">左からワイプ</option>
    <option value="slide">スライド</option>
    <option value="zoom">ズーム</option>
    <option value="glitch">グリッチ</option>
  </select></label>
  <label>長さ <input id="clipTransDuration" type="number" min="0.1" max="1.5" step="0.05" value="0.4"> 秒</label>
  <button id="btnPreviewTransition" type="button">切替を再生</button>
  <span class="muted">選択したクリップが始まる位置に適用</span>
</div>
<div class="tl">
  <div class="tl-bar">
    <button type="button" id="zoomOut" title="縮小">−</button>
    <button type="button" id="zoomFit" title="全体を表示">全体</button>
    <button type="button" id="zoomIn" title="拡大">＋</button>
    <label class="snap-toggle" title="再生位置とほかのクリップの端に吸着します。ドラッグ中はShiftで一時的に解除"><input id="snapClips" type="checkbox" checked> 吸着</label>
    <button type="button" id="btnFillGaps" title="手で調整した配置は残し、未使用の画像から隙間を埋めます">隙間を自動で埋める</button>
    <span class="muted">Shift+ドラッグで吸着解除 · ホイールで左右、Ctrl+ホイールで拡大 · Deleteで削除、Ctrl+Zで戻す、Ctrl+C/Vでコピー・貼り付け</span>
  </div>
  <div id="tracks"></div>
</div>
<input id="addFront" class="picker" type="file" accept="image/*,video/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.heic,.jfif,.mp4,.webm,.mov" multiple>
<input id="addBack" class="picker" type="file" accept="image/*,video/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.heic,.jfif,.mp4,.webm,.mov" multiple>
<input id="replaceClip" class="picker" type="file" accept="video/*,.mp4,.webm,.mov">
<script src="/vendor/mp4-muxer.min.js"></script>
<script src="/src/01_util.js"></script>
<script src="/src/02_fonts.js"></script>
<script src="/src/02b_lang.js"></script>
<script src="/src/03_text.js"></script>

<script src="/src/05b_registry.js"></script>
<script src="/src/06_layouts.js"></script>
<script src="/src/07_decor.js"></script>
<script src="/src/08_planner.js"></script>
<script src="/src/08b_omakase.js"></script>
<script src="/src/09_render.js?v=transition-1"></script>
<script src="/src/09b_autoimg.js"></script>
<script src="/src/10_audio.js?v=transition-1"></script>
<script src="/src/11_export.js?v=preview-2"></script>
